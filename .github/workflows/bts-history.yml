name: Refresh BTS flight history

# Rebuilds public/data/aa-history.json from free, public-domain US DOT/BTS on-time data
# and commits it to the chosen branch. Never touches production settings or secrets.
on:
  # Also runs when the pipeline itself changes on a feature branch, so it can be
  # reviewed in a PR before it ever reaches main.
  push:
    branches-ignore: [main]
    paths: [scripts/bts/**]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to commit the refreshed dataset to
        required: true
        default: main
      from:
        description: First month (YYYY-MM)
        required: true
        default: "2025-06"
      to:
        description: Last month (YYYY-MM)
        required: true
        default: "2026-05"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dataset
        run: node scripts/bts/build-history.mjs "${{ inputs.from || '2025-06' }}" "${{ inputs.to || '2026-05' }}" public/data/aa-history.json
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aa-history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          ls -la public/data/aa-history.json
          git commit -m "Refresh BTS flight history"
          # Another push may have landed while this ran; replay the data commit on top.
          git pull --rebase origin ${{ inputs.branch || github.ref_name }}
          git push origin HEAD:${{ inputs.branch || github.ref_name }}
