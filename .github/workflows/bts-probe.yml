name: Probe BTS T-100 form (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [scripts/bts/probe/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bts/probe/t100-probe.mjs
